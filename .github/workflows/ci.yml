name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITH: test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bundle exec rake check:worker_boundary

  # Model checking explores thread interleavings, so it runs on its own with the
  # loom cfg rather than as part of the normal test job.
  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - run: cargo test --lib loom_tests
        env:
          RUSTFLAGS: --cfg loom

  ruby:
    runs-on: ubuntu-latest
    # RuboCop lives in an optional group, so every step has to opt into it.
    env:
      BUNDLE_WITH: lint test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop
      - run: ruby -c ruby/*.rb crates/*/ruby/*.rb
      # Turns raw measurements into every number this project publishes.
      - run: bundle exec rake e2e:summarize
      # The whole installed interface.
      - run: bundle exec rake e2e:cli

  # The real proxy, on the only platform Ruvoy targets. Two suites were silently
  # broken for weeks because nothing but a developer's machine ever ran them.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNDLE_WITH: test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: astral-sh/setup-uv@v6
      - run: bundle exec rake tools:oha
      - run: bundle exec rake e2e:envoy_fiber_rack
      - run: bundle exec rake e2e:fiber_backpressure
      - run: bundle exec rake e2e:response_streaming
      - run: bundle exec rake e2e:rack_compatibility
      - run: bundle exec rake e2e:config_lifecycle
      - run: bundle exec rake e2e:process_runtime
      - run: bundle exec rake e2e:envoy_sync_rack
      - run: bundle exec rake e2e:fiber_runtime
      - run: bundle exec rake e2e:fiber_memory
      - run: bundle exec rake e2e:envoy_extensions
      # What the suites measured, on the run's own page: a pass says nothing
      # about how much slack the numbers had.
      - if: always()
        run: |
          {
            echo '## Measurements'
            echo '```'
            for file in .agents/results/*/summary.log .agents/results/*/waves.tsv; do
              [ -e "$file" ] || continue
              echo "# $(basename "$(dirname "$file")")/$(basename "$file")"
              cat "$file"
              echo
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .agents/results/
          retention-days: 7
