[package]
name = "ruvoy"
description = "A Ruby application runtime embedded in Envoy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libc.workspace = true
magnus.workspace = true

[lints]
workspace = true

[workspace]
members = [
    "crates/ruvoy-envoy-baseline",
    "crates/ruvoy-envoy-fiber",
    "crates/ruvoy-envoy-sync",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", tag = "v1.39.1" }
libc = "0.2"
magnus = { version = "0.8.2", features = ["embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruvoy = { path = "." }

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(loom)"]

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[profile.dev]
# Full debug info dominates the build directory; line tables keep backtraces
# useful at a fraction of the size.
debug = "line-tables-only"

[profile.release]
strip = "symbols"
