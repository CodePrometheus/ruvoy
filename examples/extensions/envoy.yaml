# Serves config.ru with ruvoy.context and ruvoy.upstream turned on, next to a
# stand-in `users` service the application calls through Envoy. Run it from the
# repository root; see config.ru for the commands.
static_resources:
  listeners:
    - name: app
      address:
        socket_address: { address: 127.0.0.1, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: app
                route_config:
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        # A route needs a name for ruvoy.context to report one.
                        - name: api
                          match: { prefix: "/" }
                          non_forwarding_action: {}
                          metadata:
                            filter_metadata:
                              acme.route: { tier: gold }
                http_filters:
                  # Stands in for an authentication filter that records the caller's tenant.
                  - name: envoy.filters.http.set_metadata
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.set_metadata.v3.Config
                      metadata:
                        - metadata_namespace: acme.tenant
                          value: { id: t-42 }
                  - name: envoy.extensions.filters.http.dynamic_modules
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config: { name: ruvoy_fiber, do_not_close: true }
                      filter_name: fiber_rack
                      terminal_filter: true
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: |
                          {
                            "rackup": "examples/extensions/config.ru",
                            "context": { "metadata_namespaces": ["acme.tenant", "acme.route"] },
                            "upstream": { "clusters": ["users"], "timeout_ms": 2000 }
                          }

    # The `users` service: canned answers, each 200ms late.
    - name: users
      address:
        socket_address: { address: 127.0.0.1, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: users
                route_config:
                  virtual_hosts:
                    - name: users
                      domains: ["*"]
                      routes:
                        - match: { safe_regex: { regex: "/users/\\d+/orders" } }
                          direct_response:
                            status: 200
                            body: { inline_string: '[{"id":1,"total":42},{"id":2,"total":7}]' }
                        - match: { safe_regex: { regex: "/users/\\d+" } }
                          direct_response:
                            status: 200
                            body: { inline_string: '{"name":"Ada Lovelace","plan":"pro"}' }
                http_filters:
                  - name: envoy.filters.http.fault
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                      delay:
                        fixed_delay: 0.2s
                        percentage: { numerator: 100 }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: users
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: users
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8081 }
