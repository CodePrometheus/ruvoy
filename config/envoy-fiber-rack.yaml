# The extension that starts the Ruby runtime and names the application; the
# rack filter below joins it.
bootstrap_extensions:
  - name: ruvoy
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.bootstrap.dynamic_modules.v3.DynamicModuleBootstrapExtension
      dynamic_module_config:
        name: ruvoy_fiber
        do_not_close: true
      extension_name: ruvoy
      extension_config:
        "@type": type.googleapis.com/google.protobuf.StringValue
        value: '{"rackup": "bench/config.ru"}'
# Envoy's allocator keeps freed memory unless told to hand some back.
memory_allocator_manager: { bytes_to_release: 1048576, memory_release_interval: 1s }
static_resources:
  listeners:
    - name: ruvoy_fiber_rack
      per_connection_buffer_limit_bytes: 4194304
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 19183
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ruvoy_fiber_rack
                codec_type: AUTO
                # A stuck Ruby Fiber never writes to the stream, so without an
                # explicit bound the request would hang for Envoy's 5m default.
                stream_idle_timeout: 15s
                request_timeout: 30s
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains:
                        - "*"
                http_filters:
                  - name: envoy.extensions.filters.http.dynamic_modules
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: ruvoy_fiber
                        do_not_close: true
                      filter_name: fiber_rack
                      terminal_filter: true
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: "{}"
    - name: ruvoy_fiber_control
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 19184
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ruvoy_fiber_control
                codec_type: AUTO
                route_config:
                  name: control_route
                  virtual_hosts:
                    - name: control_service
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: fiber-control-ok
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
